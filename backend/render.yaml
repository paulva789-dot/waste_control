databases:
  - name: dwms-postgres
    plan: free
    databaseName: dwms
    user: dwms

services:
  - type: web
    name: dwms-backend
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: node src/server.js
    healthCheckPath: /health
    disk:
      name: dwms-uploads
      mountPath: /opt/render/project/src/uploads
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dwms-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_ORIGIN
        value: https://waste-control-eta.vercel.app
      - key: DEMO_LOGIN_ENABLED
        value: "true"
      - key: NODE_ENV
        value: production
